# Render Blueprint – deployt Phase 10 automatisch (inkl. Datenbank).
# Auf render.com -> New -> Blueprint -> dieses Repo wählen.
databases:
  - name: phasezehn-db
    plan: free

services:
  - type: web
    name: phasezehn
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Räume dauerhaft speichern (überleben Neustart/Schlafmodus)
      - key: DATABASE_URL
        fromDatabase:
          name: phasezehn-db
          property: connectionString
